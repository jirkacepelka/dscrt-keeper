name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Daily. The shapes job below is the only thing that would notice the contract growing
    # or renaming a field, and it needs to run without waiting for someone to push.
    - cron: "17 6 * * *"

permissions:
  contents: read

jobs:
  check:
    name: Types, console and image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # `ci`, not `install`: it fails on a lockfile that disagrees with package.json, which
      # is the check worth having for a container that holds a signing key.
      - run: npm ci

      - run: npm run typecheck

      # The console's API, end to end against a real process on a real port: the password
      # gate, the environment-beats-file rule, that a stored key never comes back out, and
      # that the static handler cannot be walked out of. No chain involved — the server
      # answers before the first upkeep pass, so a testnet outage cannot fail this.
      - name: Console API
        run: npm test

      # This repository was extracted from a monorepo whose Dockerfile copied from `keeper/`,
      # and nothing short of an actual build would notice if a path like that came back. It
      # now also has to copy `web/`, which is a second way to ship an image that starts and
      # then serves nothing.
      - name: Build the image
        run: docker build -t dscrt-keeper:ci .

      # Sends nothing and needs no key. Proves the image starts, reaches the chain and reads
      # the protocol, which together are most of what "it works" means here.
      - name: Health probe against the live protocol
        run: docker run --rm dscrt-keeper:ci node --experimental-strip-types src/index.ts --check-only

      # The container has to come up as a container — with its volume, its port, its
      # entrypoint dropping from root, and its healthcheck — not just as a process. Every one
      # of those is a way for the image to build cleanly and be unusable on the box it was
      # built for.
      - name: The container serves its console
        run: |
          set -eux
          mkdir -p ci-data
          docker run -d --name keeper-ci -p 8787:8787 \
            -v "$PWD/ci-data:/data" --read-only dscrt-keeper:ci

          # `/healthz` answers 503 until the first pass completes, which is a correct answer
          # and not a reason to keep waiting for a different one.
          for _ in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8787/healthz || true)
            case "$code" in 200|503) break ;; esac
            sleep 1
          done
          test "$code" = "200" -o "$code" = "503"

          curl -fsS http://127.0.0.1:8787/ | grep -q 'dSCRT keeper'

          # The entrypoint must have dropped. `docker exec` would start a fresh process as
          # the image's user, which is root by design, so this asks who owns PID 1 instead —
          # the only process that matters here.
          owner=$(docker exec keeper-ci stat -c %U /proc/1)
          test "$owner" = "node" || (echo "PID 1 is running as $owner" && exit 1)

          # The volume has to be genuinely writable *by that user*, or the keeper keeps no
          # history and saves no settings while looking perfectly healthy. Asked as `node`
          # rather than as root, which could write to it either way and would prove nothing.
          docker exec -u node keeper-ci test -w /data

          docker rm -f keeper-ci

  shapes:
    name: Contract shapes
    # Not on pull_request: this queries a live testnet, and a chain having a bad afternoon
    # must never be able to block a merge.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:shapes
