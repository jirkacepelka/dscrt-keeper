name: Publish the image

# What makes the ZimaOS install a paste rather than a project.
#
# The App Store entry pulls `ghcr.io/jirkacepelka/dscrt-keeper`, so the image has to exist
# before anybody can install it — and it has to exist for arm64 as well as amd64, because a
# Zimablade is not an x86 box and an image that only runs on one of them fails at `docker
# run` with an error that says nothing useful about why.
on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    name: Build and push
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # arm64 is built under emulation. It is slow and it is correct, and the alternative —
      # a self-hosted arm runner — is a machine to maintain for an image that changes rarely.
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          # `latest` follows main, and a tag gets its own version. ZimaOS installs `latest`,
          # so a push to main is a release whether or not it was meant as one — which is the
          # argument for tagging anything you would not want a home server to pick up.
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
